services:
  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile

    container_name: icasei-bff

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_PATH: /app/data/icasei.sqlite

    volumes:
      - bff-data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  bff-data:
