services:
  mf-videos:
    build:
      context: .
      dockerfile: apps/mf-videos/Dockerfile
      args:
        VITE_USE_MOCKS: "false"

    container_name: icasei-mf-videos

    ports:
      - "127.0.0.1:5175:80"

    restart: unless-stopped
  mf-drawer:
    build:
      context: .
      dockerfile: apps/mf-drawer/Dockerfile

    container_name: icasei-mf-drawer

    ports:
      - "127.0.0.1:5174:80"

    restart: unless-stopped
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
      args:
        VITE_USE_MOCKS: "false"

    container_name: icasei-shell

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      bff:
        condition: service_healthy

    restart: unless-stopped
  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile

    container_name: icasei-bff

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - ./apps/bff/.env

    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_PATH: /app/data/icasei.sqlite

    volumes:
      - bff-data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  bff-data:
