server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite carregar módulos federados de outra origem
    add_header Access-Control-Allow-Origin "*" always;

    # Impede o cache de versões antigas do remoteEntry
    location = /remoteEntry.js {
        try_files $uri =404;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # Arquivos JavaScript, CSS e demais assets
    location /assets/ {
        try_files $uri =404;
    }

    # Fallback para navegação SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
