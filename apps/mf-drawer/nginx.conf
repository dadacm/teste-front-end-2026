server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite que o Shell carregue os módulos federados
    add_header Access-Control-Allow-Origin "*" always;

    # Evita armazenar versões antigas do remoteEntry
    location = /remoteEntry.js {
        try_files $uri =404;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # Arquivos estáticos devem retornar 404 se não existirem
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
